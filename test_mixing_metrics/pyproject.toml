[project]
name = "test-mixing-metrics"
version = "0.1.0"
description = ""
authors = [
    {name = "jthro",email = "jethro.rosette@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonlines (>=4.0.0,<5.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "numpy (>=2.3.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "test_mixing_metrics", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
test_mixing_metrics = "test_mixing_metrics.test_mixing_metrics:main"